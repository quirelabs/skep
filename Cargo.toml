[workspace]
resolver = "3"
members = [
    "crates/comb",
    "crates/fake-service",
    "crates/comb-services",
    "crates/skep-cli",
    "crates/skep-helper",
    "crates/skep-mcp",
    "app/skep",
]

# The fake service exists for tests only, so a plain build leaves it out.
default-members = [
    "crates/comb",
    "crates/comb-services",
    "crates/skep-cli",
    "crates/skep-helper",
    "crates/skep-mcp",
    "app/skep",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/quirelabs/skep"
homepage = "https://skep.quirelabs.com"
readme = "README.md"

[workspace.dependencies]
# Pinned to Zed v1.15.0, the same revision quirelabs/browser uses.
# See docs/decisions/gpui-rev.md before changing. Never Zed's `ui` crate: it is
# GPL and this workspace is Apache-2.0 OR MIT.
gpui = { git = "https://github.com/zed-industries/zed", rev = "e17dc4f9d50db73a458b64dcce50ecd4878b98a3", default-features = false, features = [
    "font-kit",
] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "e17dc4f9d50db73a458b64dcce50ecd4878b98a3", default-features = false, features = [
    "font-kit",
] }

# crates.io has no namespaces, so the published names carry the prefix while
# the libraries keep their own.
# The version is what makes these publishable: cargo refuses a path
# dependency without one.
comb = { package = "quire-comb", version = "0.0.0", path = "crates/comb" }
comb-services = { package = "quire-comb-services", version = "0.0.0", path = "crates/comb-services" }

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "process",
    "net",
    "io-util",
    "signal",
] }
futures = "0.3"
libc = "0.2"
# The menubar item, which GPUI has no API for at this revision. App only: the
# engine never touches AppKit.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    "NSMenu",
    "NSMenuItem",
    "NSApplication",
    "NSResponder",
    "NSView",
    "NSControl",
    "NSButton",
    "NSColor",
    "NSAttributedString",
] }
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSAttributedString",
    "NSDictionary",
] }
sha2 = "0.10"
# The proxy behind local domains. rustls is pinned to ring so a clone builds
# without cmake or a C toolchain.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# Certificates for local domains. Defaults to the ring provider, which keeps
# cargo build free of cmake and a C toolchain.
# Already in the tree through rcgen, whose own API speaks these types.
time = { version = "0.3", default-features = false, features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = "0.7"
rmcp = { version = "3.1", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
] }
