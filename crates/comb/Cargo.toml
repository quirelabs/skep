[package]
name = "quire-comb"
description = "Supervision and orchestration engine for local development services"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

# Published under the Quire Labs prefix; the library keeps its own name, so
# every dependent still writes `use comb::...`.
[lib]
name = "comb"

[dependencies]
# The `sites` half only. A supervision engine has no business pulling a TLS
# stack, an http server and a certificate library into a build that will never
# serve a hostname, so none of these are here unless the feature asks.
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
time = { workspace = true, optional = true }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, optional = true }

# Only the signal boundary in src/signal.rs needs it.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio"] }

[[bench]]
name = "boot"
harness = false

# The local domains tests, skipped rather than emptied when the feature that
# builds what they test is off.
[[test]]
name = "certs"
required-features = ["sites"]

[[test]]
name = "dns"
required-features = ["sites"]

[[test]]
name = "domains"
required-features = ["sites"]

[[test]]
name = "sites"
required-features = ["sites"]

[features]
default = []
tracing = ["dep:tracing"]

# Local domains: the certificate authority, the TLS terminating proxy, the
# resolver for the managed suffix, and the privileged helper that takes 80 and
# 443. Off by default, because supervision is what this crate is for and this
# is where every heavy dependency it has comes from. Skep the product turns it
# on. What stays either way is the map of hostname to port, which the engine
# has to carry wherever it runs.
sites = [
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:rcgen",
    "dep:rustls",
    "dep:time",
    "dep:tokio-rustls",
]
