name: Release

# Cut by tagging. Nothing here runs on a push to main: a release is a
# deliberate act, and the tag is the record of it.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    # Skep pins arm64 releases of every service it runs, so the binaries that
    # drive them are built on the architecture they are for.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Confirm the runner is Apple silicon
        run: |
          test "$(uname -m)" = "arm64" || {
            echo "skep pins arm64 releases; this runner is $(uname -m)" >&2
            exit 1
          }

      # rustup reads rust-toolchain.toml, so the pinned version is what builds.
      - name: Toolchain
        run: rustup show

      # The command line, the agent surface, and the privileged helper that
      # `skep domains install` puts in place. Not the window: it ships on its
      # own, signed and notarised, and building gpui here would add minutes to
      # every release for an artifact nobody is downloading yet.
      - name: Build
        run: cargo build --release -p skep-cli -p skep-mcp -p skep-helper

      - name: Everything it claims to be
        run: |
          ./target/release/skep help > /dev/null
          test -x ./target/release/skep-mcp
          test -x ./target/release/skep-helper

      # A tag saying one version while the binary says another is the kind of
      # thing nobody notices until somebody reports a bug against the wrong
      # one. Bump workspace.package.version before tagging.
      - name: The tag and the binary agree
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          built="$(./target/release/skep --version | awk '{print $2}')"
          test "$tagged" = "$built" || {
            echo "tagged v${tagged} but the binary says ${built}" >&2
            echo "bump workspace.package.version in Cargo.toml and tag again" >&2
            exit 1
          }

      # One archive under a name that does not move, so the install line in
      # the README can point at `releases/latest/download` and keep working.
      # The version is on the release itself, and in `skep --version`.
      - name: Package
        run: |
          name="skep-aarch64-apple-darwin"
          mkdir -p dist/skep
          cp target/release/skep target/release/skep-mcp target/release/skep-helper dist/skep/
          cp README.md LICENSE-APACHE LICENSE-MIT dist/skep/
          tar -czf "dist/${name}.tar.gz" -C dist skep
          # Beside it, so a download can be checked rather than trusted.
          cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

  # The window, as something a person double clicks. Separate from the
  # binaries job because it needs secrets that a fork's pull request will
  # never have, and a release without them should still produce the command
  # line rather than nothing at all.
  app:
    runs-on: macos-latest
    # Notarisation takes minutes of waiting on Apple, not on us.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup show

      # Everything below needs a Developer ID. Said once, here, so the rest of
      # the job can assume it and the skip is legible in the log.
      - name: Is this a signing build
        id: signing
        env:
          # Through the environment rather than interpolated into the script,
          # so a certificate never lands on a command line.
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$CERTIFICATE" ]; then
            echo "possible=true" >> "$GITHUB_OUTPUT"
          else
            echo "possible=false" >> "$GITHUB_OUTPUT"
            echo "no APPLE_CERTIFICATE; the dmg will not be built" >&2
          fi

      # A keychain of its own, deleted at the end, so nothing is left behind
      # on a runner that is reused.
      - name: Signing identity
        if: steps.signing.outputs.possible == 'true'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/certificate.p12 -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Without this codesign stops to ask for the password, on a machine
          # with nobody at it.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain > /dev/null
          rm -f /tmp/certificate.p12

      - name: Bundle and sign
        if: steps.signing.outputs.possible == 'true'
        env:
          SKEP_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: scripts/bundle.sh --sign

      - name: Disk image
        if: steps.signing.outputs.possible == 'true'
        env:
          SKEP_SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: scripts/dmg.sh

      # Submitted and waited for. The staple is the point: it writes the
      # ticket into the image so a machine with no network still opens it
      # without a warning.
      - name: Notarise
        if: steps.signing.outputs.possible == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit target/bundle/Skep.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM" \
            --wait --timeout 30m
          xcrun stapler staple target/bundle/Skep.dmg
          # What a person's machine will decide, asked here instead.
          spctl --assess --type open --context context:primary-signature \
            -vv target/bundle/Skep.dmg

      - name: Name it for the release
        if: steps.signing.outputs.possible == 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv target/bundle/Skep.dmg "target/bundle/Skep-${version}-aarch64.dmg"
          cd target/bundle && shasum -a 256 "Skep-${version}-aarch64.dmg" \
            > "Skep-${version}-aarch64.dmg.sha256"

      # What a copy already installed reads to find out it is behind. A
      # release asset rather than a website, so this works before there is a
      # website and keeps working if there never is one: `latest` is a
      # redirect, so the url never changes as versions do.
      - name: Say what the latest release is
        if: steps.signing.outputs.possible == 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="Skep-${version}-aarch64.dmg"
          # The same tool the app checks it with, on the file that is actually
          # being published rather than on one built a second time.
          sum="$(shasum -a 256 "target/bundle/${image}" | cut -d' ' -f1)"
          cat > target/bundle/latest.json <<JSON
          {
            "version": "${version}",
            "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${image}",
            "sha256": "${sum}",
            "notes": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          }
          JSON
          python3 -c "import json,sys; json.load(open('target/bundle/latest.json'))"

      - name: Release
        if: steps.signing.outputs.possible == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/bundle/*.dmg
            target/bundle/*.sha256
            target/bundle/latest.json
          fail_on_unmatched_files: true

      - name: Leave nothing on the runner
        if: always() && steps.signing.outputs.possible == 'true'
        run: security delete-keychain build.keychain || true
